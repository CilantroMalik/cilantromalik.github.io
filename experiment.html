<!DOCTYPE html>
<html>
  <head>
    <title>RM — LING 784 Final Project</title>
    <script src="https://unpkg.com/jspsych@8.2.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script>
    <link href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css" rel="stylesheet" type="text/css" />
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <style>
        p { font-family: 'IBM Plex Serif', serif; font-weight: 400; margin-block-start: 0.2em; margin-block-end: 0.2em; }
        h2 { font-family: 'IBM Plex Serif', serif; font-weight: 600; }
        h3 { font-family: 'IBM Plex Serif', serif; font-weight: 500; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  </head>
  <body></body>
  <script>
    (function(){
        emailjs.init({
            publicKey: "KvB0XoibxW2xS7QjN",
        });
    })();

    var jsPsych = initJsPsych({
        show_progress_bar: true,
        on_finish: function() {
            // jsPsych.data.displayData();
        }
    });

    // ---- constants ----
    const TRIALS_PER_ROUND = 8
    const N_ROUNDS = 5
    // ---- end constants ----

    var img_list = [];
    var img_dict = {};
    ['every', 'some'].forEach(det => {
        img_dict[det] = {};
        ["circle", "square", "triangle"].forEach(shape => {
            img_dict[det][shape] = {};
            ["red", "yellow", "green", "blue", "purple"].forEach(color => {
                img_dict[det][shape][color] = {};
                ["true", "false"].forEach(correct => {
                    img_dict[det][shape][color][correct] = [];
                    Array.from(Array(25).keys()).forEach(index => {
                        const imgName = `imgGen/shapeTrials/${det}-${shape}-${color}-${correct}-${index}.png`;
                        img_list.push(imgName);
                        img_dict[det][shape][color][correct].push(imgName);
                    });
                });
            });
        });
    });

    var random_stimuli = jsPsych.randomization.sampleWithoutReplacement(img_list, TRIALS_PER_ROUND*N_ROUNDS);

    var test_stimuli = [];

    random_stimuli.forEach(stim => {
        const image_name = stim.split("/")[2]
        const components = image_name.split("-")
        test_stimuli.push({
            stimulus: stim,
            correct: components[3] === "true" ? "y" : "n",
            det: components[0],
            shape: components[1],
            color: components[2]
        })
    });


    var books_list = [];
    var books_dict = {};
    ['every', 'some'].forEach(det => {
        books_dict[det] = {};
        ["short", "tall"].forEach(height => {
            books_dict[det][height] = {};
            ["red", "yellow", "green", "blue", "purple"].forEach(color => {
                books_dict[det][height][color] = {};
                ["true", "false"].forEach(correct => {
                    books_dict[det][height][color][correct] = [];
                    Array.from(Array(25).keys()).forEach(index => {
                        const imgName = `imgGen/bookTrials/${det}-${height}-${color}-${correct}-${index}.png`;
                        books_list.push(imgName);
                        books_dict[det][height][color][correct].push(imgName);
                    });
                });
            });
        });
    });

    var random_books = jsPsych.randomization.sampleWithoutReplacement(books_list, TRIALS_PER_ROUND*N_ROUNDS);

    var test_books = [];

    random_books.forEach(stim => {
        const image_name = stim.split("/")[2]
        const components = image_name.split("-")
        test_books.push({
            stimulus: stim,
            correct: components[3] === "true" ? "y" : "n",
            det: components[0],
            height: components[1],
            color: components[2]
        })
    });

    var timeline = [];

    var preload = {
        type: jsPsychPreload,
        images: random_stimuli.concat(random_books)
    };
    timeline.push(preload);

    const welcome = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<h3>Welcome! Press any key to begin.</h3>'
    }
    timeline.push(welcome);

    var instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <p>In this experiment, grids of shapes will appear on the screen, each along with a sentence below it that could describe the grid.</p>
            <p>If the claim expressed by the sentence is <strong>true</strong>, 
            press the letter <strong>Y</strong> (for "yes") on your keyboard <em>as fast as you can</em>.</p>
            <p>If the sentence is <strong>false</strong>, press the letter <strong>N</strong> (for "no")
            <em>as fast as you can</em>.</p>
            <hr/>
            <p>For example, consider the following example image-sentence pair:</p>
            <div style='width: 1500px;'>
            <div><img width=450 height=450 src='imgGen/shapeTrials/every-circle-blue-false-0.png'></img>
            <p class='small'>Every circle is blue.</p></div>
            </div>
            <hr/>
            <p>In this scenario, since the sentence is false (not every circle is blue: e.g. in the bottom right corner), you would <strong>press the N key</strong>.</p>
            <br/>
            <p>Also, before each image, a cross (<strong>+</strong>) will appear in the center of your screen for a few seconds; <strong>fixate on it</strong> while it is present.</p>
            <br/>
            <p><em>Press any key to begin.</em></p>
        `,
        post_trial_gap: 500
    };
    timeline.push(instructions);

    var get_name = {
        type: jsPsychSurveyText,
        questions: [
            {prompt: 'What is your name?', required: true, name: 'name'},
            {prompt: 'Briefly describe your experience (or lack thereof) with linguistics.', required: true, name: 'ling_background'}
        ],
        data: {
            task: 'intro_survey'
        }
    }
    timeline.push(get_name)

    var fixation = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div style="font-size:60px;">+</div>',
        choices: "NO_KEYS",
        trial_duration: function(){ return jsPsych.randomization.sampleWithoutReplacement([1000, 1250, 1500, 1750, 2000, 2250, 2500, 2750, 3000], 1)[0]; },
        data: {
            task: 'fixation'
        },
        record_data: false
    };

    var test = {
        type: jsPsychImageKeyboardResponse,
        stimulus: jsPsych.timelineVariable('stimulus'),
        stimulus_width: 550,
        prompt: function() {
            const html = `<h2>${jsPsych.evaluateTimelineVariable('det').includes('every') ? "Every" : "Some"} ${jsPsych.evaluateTimelineVariable('shape')} is ${jsPsych.evaluateTimelineVariable('color')}.</h2>`;
            return html;
        },
        choices: ['y', 'n'],
        data: {
            task: 'response',
            correct: jsPsych.timelineVariable('correct'),
            det: function() {
                const html = `${jsPsych.evaluateTimelineVariable('det')}`;
                return html;
            },
            condition: function() {
                const html = `${jsPsych.evaluateTimelineVariable('shape')}-${jsPsych.evaluateTimelineVariable('color')}`;
                return html;
            }
        },
        on_finish: function(data) {
            data.answer = jsPsych.pluginAPI.compareKeys(data.response, data.correct);
        }
    };

    var rest = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <hr/>
            <h3 style="font-size:60px;">A short break :)</h3>
            <hr/>
            <p><em>Press any key when you're ready to continue.</em></p>
        `,
        data: {
            task: 'rest'
        },
        record_data: false
    };

    var procedures = [];
    for (var i = 0; i < N_ROUNDS*TRIALS_PER_ROUND; i += TRIALS_PER_ROUND) {
        procedures.push({
            timeline: [fixation, test],
            timeline_variables: test_stimuli.slice(i,i+TRIALS_PER_ROUND),
            randomize_order: true,
            repetitions: 1
        })
    }

    for (let i = 0; i < N_ROUNDS; i++) {
        timeline.push(procedures[i]);
        if (i !== N_ROUNDS-1) timeline.push(rest);
    }

    var debrief_block = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
            

            var trials = jsPsych.data.get().filter({task: 'response'});
            var correct_trials = trials.filter({answer: true});
            var accuracy = Math.round(correct_trials.count() / trials.count() * 100);
            var rt = Math.round(correct_trials.select('rt').mean());

            return `<hr/><p>You responded correctly on ${accuracy}% of the trials.</p>
            <p>Your average response time was ${rt}ms.</p>
            <hr/>
            <p>Press any key to move to the next part.</p>`;

        }
    };
    timeline.push(debrief_block);

    const interlude = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <hr/>
            <p>Now, the visual setting will slightly change, but the instructions remain the same:</p>
            <p>press <strong>Y</strong> or <strong>N</strong> depending on whether the sentence is true or false, <em>as fast as you possibly can.</em></p>
            <hr/>
            <p><em>Press any key to begin.</em></p>`,
        post_trial_gap: 1000
    }
    timeline.push(interlude);

    var test2 = {
        type: jsPsychImageKeyboardResponse,
        stimulus: jsPsych.timelineVariable('stimulus'),
        stimulus_width: 430,
        prompt: function() {
            const html = `<h2>${jsPsych.evaluateTimelineVariable('det').includes('every') ? "Every" : "Some"} ${jsPsych.evaluateTimelineVariable('color')} book is ${jsPsych.evaluateTimelineVariable('height')}.</h2>`;
            return html;
        },
        choices: ['y', 'n'],
        data: {
            task: 'response2',
            correct: jsPsych.timelineVariable('correct'),
            det: function() {
                const html = `${jsPsych.evaluateTimelineVariable('det')}`;
                return html;
            },
            condition: function() {
                const html = `${jsPsych.evaluateTimelineVariable('color')}-${jsPsych.evaluateTimelineVariable('height')}`;
                return html;
            }
        },
        on_finish: function(data) {
            data.answer = jsPsych.pluginAPI.compareKeys(data.response, data.correct);
        }
    };

    var procedures2 = [];
    for (var i = 0; i < N_ROUNDS*TRIALS_PER_ROUND; i += TRIALS_PER_ROUND) {
        procedures2.push({
            timeline: [fixation, test2],
            timeline_variables: test_books.slice(i,i+TRIALS_PER_ROUND),
            randomize_order: true,
            repetitions: 1
        })
    }

    for (let i = 0; i < N_ROUNDS; i++) {
        timeline.push(procedures2[i]);
        if (i !== N_ROUNDS-1) timeline.push(rest);
    }

    var debrief_block2 = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
            var trials = jsPsych.data.get().filter({task: 'response2'});
            var correct_trials = trials.filter({answer: true});
            var accuracy = Math.round(correct_trials.count() / trials.count() * 100);
            var rt = Math.round(correct_trials.select('rt').mean());

            return `<hr/><p>You responded correctly on ${accuracy}% of the trials.</p>
            <p>Your average response time was ${rt}ms.</p>
            <hr/>
            <p>Press any key to complete the experiment. Thank you!</p>`;
        }
    };
    timeline.push(debrief_block2);

    var data_dump = {
        type: jsPsychCallFunction,
        func: function() { 
            var trials = [];
            const survey_answers = jsPsych.data.get().filter({task: 'intro_survey'}).trials[0].response
            for (const tr of jsPsych.data.get().filter({task: 'response'}).trials.concat(jsPsych.data.get().filter({task: 'response2'}).trials)) {
                trials.push([tr.det, tr.condition, tr.correct == "y", tr.answer ? "√" : "x", tr.rt]);
            }
            // console.log(trials);
            const resp_obj = {
                survey_answers: survey_answers,
                trial_data: trials
            }

            const now = new Date();
            emailjs.send("service_vhs3iqn", "template_xynan5a", {name: survey_answers.name, time: now.toISOString(), message: JSON.stringify(resp_obj), title: survey_answers.name}).then(
                (response) => {
                    console.log('success!', response.status, response.text);
                },
                (error) => {
                    console.log('failure...', error);
                },
            );
        }
    }
    timeline.push(data_dump)

    jsPsych.run(timeline);
  </script>
</html>
